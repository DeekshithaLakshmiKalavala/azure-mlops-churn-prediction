name: MLOps CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"
  IMAGE_NAME: "churn-api"
  MLFLOW_EXPERIMENT_NAME: "churn-prediction"
  MODEL_NAME: "churn-prediction-model"

jobs:

  # ════════════════════════════════════════════════════════════
  # JOB 1 — Unit Tests
  # ════════════════════════════════════════════════════════════
  test:
    name: 🧪 Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pydantic==2.7.4
          pip install mlflow==2.15.1
          pip install evidently==0.4.40
          pip install fastapi==0.115.0 uvicorn==0.30.6 pandas==2.2.2 numpy==1.26.4 scikit-learn==1.5.1 joblib==1.4.2 pytest==8.3.2 httpx==0.27.2 python-multipart==0.0.9

      - name: Run unit tests
        run: pytest tests/ -v --tb=short --rootdir=.

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: reports/
          retention-days: 7

  # ════════════════════════════════════════════════════════════
  # JOB 2 — Train model & log to MLflow
  # ════════════════════════════════════════════════════════════
  train:
    name: 🤖 Train & Register Model
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pydantic==2.7.4
          pip install mlflow==2.15.1
          pip install evidently==0.4.40
          pip install fastapi==0.115.0 uvicorn==0.30.6 pandas==2.2.2 numpy==1.26.4 scikit-learn==1.5.1 joblib==1.4.2 pytest==8.3.2 httpx==0.27.2 python-multipart==0.0.9

      - name: Train model with MLflow tracking
        env:
          MLFLOW_TRACKING_URI: mlruns
          DATA_PATH: data/churn.csv
        run: python src/train.py

      - name: Upload trained model
        uses: actions/upload-artifact@v4
        with:
          name: trained-model
          path: models/
          retention-days: 30

  # ════════════════════════════════════════════════════════════
  # JOB 3 — Drift Check
  # ════════════════════════════════════════════════════════════
  drift-check:
    name: 📊 Drift Check
    runs-on: ubuntu-latest
    needs: train
    if: github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install pydantic==2.7.4
          pip install mlflow==2.15.1
          pip install evidently==0.4.40
          pip install fastapi==0.115.0 uvicorn==0.30.6 pandas==2.2.2 numpy==1.26.4 scikit-learn==1.5.1 joblib==1.4.2 pytest==8.3.2 httpx==0.27.2 python-multipart==0.0.9

      - name: Run drift monitor
        run: |
          python src/monitor.py \
            --ref data/churn.csv \
            --cur data/churn.csv || \
          if [ "${{ vars.IGNORE_DRIFT }}" = "true" ]; then
            echo "Drift detected but IGNORE_DRIFT=true — continuing"
            exit 0
          else
            echo "Drift detected — blocking deployment"
            exit 1
          fi

      - name: Upload drift reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: drift-reports
          path: reports/
          retention-days: 14

  # ════════════════════════════════════════════════════════════
  # JOB 4 — Build & Push Docker image to ACR
  # ════════════════════════════════════════════════════════════
  docker-build-push:
    name: 🐳 Build & Push to ACR
    runs-on: ubuntu-latest
    needs: [train, drift-check]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download trained model
        uses: actions/download-artifact@v4
        with:
          name: trained-model
          path: models/

      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Build & Push Docker image
        run: |
          docker build \
            -t ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest \
            -t ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }} \
            .
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:latest
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}

  # ════════════════════════════════════════════════════════════
  # JOB 5 — Deploy to Azure Container Instances
  # ════════════════════════════════════════════════════════════
  deploy:
    name: 🚀 Deploy to Azure
    runs-on: ubuntu-latest
    needs: docker-build-push
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Log in to Azure
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Container Instances
        uses: azure/aci-deploy@v1
        with:
          resource-group: ${{ secrets.AZURE_RESOURCE_GROUP }}
          dns-name-label: churn-api-${{ github.run_number }}
          image: ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          registry-login-server: ${{ secrets.ACR_LOGIN_SERVER }}
          registry-username: ${{ secrets.ACR_USERNAME }}
          registry-password: ${{ secrets.ACR_PASSWORD }}
          name: churn-prediction-api
          location: eastus
          ports: "8000"

      - name: Print deployed endpoint
        run: |
          echo "API deployed!"
          echo "Endpoint: http://churn-api-${{ github.run_number }}.eastus.azurecontainer.io:8000"
          echo "Docs:     http://churn-api-${{ github.run_number }}.eastus.azurecontainer.io:8000/docs"